
name: Test and Deploy Credit Risk Model

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check application files
        run: |
          test -s index.html
          test -s model.onnx
          grep -qi "onnxruntime" index.html

      - name: Validate ONNX model
        run: |
          python -m pip install --quiet onnx
          python -c "import onnx; onnx.checker.check_model('model.onnx'); print('ONNX model valid')"

      - name: Deploy to Hugging Face
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: sanny23/credit-risk-random-forest
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: static
          include: |
            index.html
            model.onnx
          delete_removed: false
